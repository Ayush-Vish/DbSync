name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          g++ \
          liburing-dev \
          libabsl-dev \
          pkg-config

    - name: Build tests
      working-directory: tests
      run: make all

    - name: Run tests
      working-directory: tests
      run: make test
